# Sao lưu database TH EDU Companion hằng ngày (02:00 giờ Việt Nam) — bản dump MÃ HOÁ, giữ 30 ngày.
#
# Cần tạo trong GitHub → Settings → Secrets and variables → Actions:
#   SUPABASE_DB_URL      Chuỗi kết nối Postgres (Supabase → Project Settings → Database → Connection string → "Session pooler"),
#                        dạng postgresql://postgres.<ref>:<mật-khẩu>@aws-0-<region>.pooler.supabase.com:5432/postgres
#   BACKUP_PASSPHRASE    Mật khẩu mã hoá bản sao lưu (≥ 24 ký tự, cất ở nơi an toàn — mất là KHÔNG giải mã được)
# Tuỳ chọn (gửi thêm 1 bản ra ngoài GitHub, vd. Cloudflare R2 / AWS S3 / Backblaze B2):
#   BACKUP_S3_ENDPOINT, BACKUP_S3_BUCKET, BACKUP_S3_ACCESS_KEY, BACKUP_S3_SECRET_KEY
#
# Khôi phục: xem docs/backup-disaster-recovery.md
name: Database backup

on:
  schedule:
    - cron: "0 19 * * *" # 19:00 UTC = 02:00 giờ Việt Nam
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: db-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Điều kiện "if" của bước không đọc được env khai báo trong chính bước đó → đặt cờ ở cấp job
      HAS_S3: ${{ secrets.BACKUP_S3_BUCKET != '' }}
    steps:
      - name: Cài pg_dump 17 (phải ≥ phiên bản Postgres của Supabase)
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client-17
          pg_dump --version

      - name: Dump database (schema public + auth + storage metadata)
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          test -n "$SUPABASE_DB_URL" || { echo "::error::Thiếu secret SUPABASE_DB_URL"; exit 1; }
          STAMP=$(TZ=Asia/Ho_Chi_Minh date +%Y-%m-%d_%H%M)
          echo "STAMP=$STAMP" >> "$GITHUB_ENV"
          mkdir -p backups
          # -Fc: định dạng nén, khôi phục chọn lọc được bằng pg_restore; không kèm owner/quyền để khôi phục sang project mới
          /usr/lib/postgresql/17/bin/pg_dump "$SUPABASE_DB_URL" \
            --format=custom --compress=9 --no-owner --no-privileges \
            --schema=public --schema=auth --schema=storage \
            --file="backups/th-edu-$STAMP.dump"
          # Kiểm tra bản dump đọc được + có bảng chính (bản sao lưu hỏng = không có sao lưu)
          /usr/lib/postgresql/17/bin/pg_restore --list "backups/th-edu-$STAMP.dump" > toc.txt
          for t in students attendance daily_reports fees profiles; do
            grep -q "TABLE DATA public $t " toc.txt || { echo "::error::Bản dump thiếu dữ liệu bảng $t"; exit 1; }
          done
          ls -lh backups/

      - name: Mã hoá (AES-256) — bản dump chứa dữ liệu cá nhân học sinh
        env:
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          set -euo pipefail
          test ${#BACKUP_PASSPHRASE} -ge 24 || { echo "::error::BACKUP_PASSPHRASE phải ≥ 24 ký tự"; exit 1; }
          gpg --batch --yes --pinentry-mode loopback --passphrase "$BACKUP_PASSPHRASE" \
            --symmetric --cipher-algo AES256 --output "backups/th-edu-$STAMP.dump.gpg" "backups/th-edu-$STAMP.dump"
          shred -u "backups/th-edu-$STAMP.dump"
          sha256sum "backups/th-edu-$STAMP.dump.gpg" | tee "backups/th-edu-$STAMP.sha256"

      - name: Lưu vào GitHub Artifacts (30 ngày)
        uses: actions/upload-artifact@v4
        with:
          name: th-edu-db-${{ env.STAMP }}
          path: backups/
          retention-days: 30
          if-no-files-found: error

      - name: Gửi bản sao ra kho S3 ngoài (tuỳ chọn)
        env:
          S3_ENDPOINT: ${{ secrets.BACKUP_S3_ENDPOINT }}
          S3_BUCKET: ${{ secrets.BACKUP_S3_BUCKET }}
          AWS_ACCESS_KEY_ID: ${{ secrets.BACKUP_S3_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.BACKUP_S3_SECRET_KEY }}
          AWS_DEFAULT_REGION: auto
        if: env.HAS_S3 == 'true'
        run: aws s3 cp backups/ "s3://$S3_BUCKET/th-edu-companion/db/" --recursive --endpoint-url "$S3_ENDPOINT"
