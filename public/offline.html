<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#1E4FB0" />
    <title>Mất kết nối · TH EDU</title>
    <style>
      :root { color-scheme: light; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px 16px calc(24px + env(safe-area-inset-bottom));
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        background: #f8fafc;
        color: #0f172a;
        text-align: center;
      }
      .card { max-width: 380px; width: 100%; }
      .saved { margin-top: 24px; text-align: left; display: none; }
      .saved h2 { font-size: 14px; margin: 0 0 8px; color: #0f172a; }
      .saved a { display: block; padding: 12px 14px; margin-bottom: 8px; border-radius: 12px; background: #fff; color: #0f172a; text-decoration: none; font-weight: 600; font-size: 15px; box-shadow: 0 0 0 1px #e2e8f0; }
      .saved a span { display: block; font-weight: 400; font-size: 12px; color: #64748b; }
      img { width: 72px; height: 72px; border-radius: 18px; }
      h1 { font-size: 20px; margin: 20px 0 8px; }
      p { margin: 0; color: #64748b; font-size: 14px; line-height: 1.6; }
      button {
        margin-top: 24px;
        height: 48px;
        padding: 0 28px;
        border: 0;
        border-radius: 12px;
        background: #1E4FB0;
        color: #fff;
        font: inherit;
        font-weight: 600;
        font-size: 15px;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <img src="/icons/icon-192.png" alt="TH EDU" />
      <h1>Không có kết nối mạng</h1>
      <p>Vui lòng kiểm tra Wi-Fi hoặc 4G. Trong lúc chờ, bạn vẫn xem lại được các trang đã mở trước đó.</p>
      <button type="button" onclick="location.reload()">Thử lại</button>
      <section class="saved" id="saved">
        <h2>Xem lại khi offline</h2>
        <div id="links"></div>
      </section>
    </main>
    <script>
      window.addEventListener("online", function () { location.reload(); });
      // Liệt kê các trang đã lưu (service worker) để mở lại khi mất mạng
      var NAMES = {
        "/parent/dashboard": "Học tập hôm nay", "/parent/schedule": "Lịch học", "/parent/attendance": "Chuyên cần",
        "/parent/progress": "Tiến độ học tập", "/parent/homework": "Bài tập về nhà", "/parent/fees": "Học phí",
        "/parent/notifications": "Bản tin", "/parent/announcements": "Thông báo trung tâm", "/parent/feedback": "Phản hồi",
        "/parent/leave-request": "Xin nghỉ học", "/parent/chat": "Nhắn tin",
        "/teacher/dashboard": "Tổng quan lớp", "/teacher/attendance": "Điểm danh", "/teacher/daily-report": "Sổ liên lạc",
        "/teacher/chat": "Tin nhắn", "/teacher/leave-requests": "Đơn xin nghỉ", "/teacher/grading": "Chấm bài"
      };
      if ("caches" in window) {
        caches.open("th-edu-pages").then(function (cache) { return cache.keys(); }).then(function (keys) {
          var seen = {}, html = "";
          keys.reverse().forEach(function (req) {
            var url = new URL(req.url);
            if (seen[url.pathname] || !NAMES[url.pathname]) return;
            seen[url.pathname] = true;
            html += '<a href="' + url.pathname + url.search + '">' + NAMES[url.pathname] + "<span>Bản đã lưu gần nhất</span></a>";
          });
          if (html) {
            document.getElementById("links").innerHTML = html;
            document.getElementById("saved").style.display = "block";
          }
        });
      }
    </script>
  </body>
</html>
